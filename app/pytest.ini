[pytest]
testpaths = __tests__
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --junit-xml=__tests__/results/junit.xml
    --html=__tests__/results/report.html
    --self-contained-html
    --benchmark-json=__tests__/results/benchmarks.json
markers =
    osrm: requires local OSRM running at 127.0.0.1:5010
    integration: integration tests (FastAPI + SQLite)
    stress: stress / benchmark tests
